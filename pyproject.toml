[project]
name = "tno-fci"
version = "0.1.0"
description = "Fit the TNO-FCI and predict the ISM Manufacturing PMI"
requires-python = ">=3.10"
dependencies = ["pandas>=2,<3", "numpy>=1.21"]

[project.scripts]
fci = "fci.cli:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["fci"]
